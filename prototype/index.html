<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DocLite · DBX 插件原型</title>
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --surface: #ffffff;
    --sidebar: #fafafa;
    --card: #ffffff;
    --border: #e5e5e5;
    --border-light: #eeeeee;
    --border-strong: #d4d4d4;
    --text: #0a0a0a;
    --text-2: #525252;
    --muted: #737373;
    --hover: #f5f5f5;
    --selected: #f0f0f0;
    --accent: #171717;
    --accent-text: #fafafa;
    --ring: #a3a3a3;
    --success: #16a34a;
    --success-bg: #edfdf3;
    --warning: #b45309;
    --warning-bg: #fff8eb;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --info: #2563eb;
    --info-bg: #eff6ff;
    --radius-sm: 4px;
    --radius-md: 6px;
    --shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
    --font-sans: "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    --font-mono: "Cascadia Code", "Cascadia Mono", "JetBrains Mono", "Fira Code", Consolas, monospace;
  }

  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #131416;
    --surface: #1b1b1e;
    --sidebar: #19191c;
    --card: #1f1f23;
    --border: rgba(110, 110, 114, 0.28);
    --border-light: rgba(110, 110, 114, 0.18);
    --border-strong: rgba(110, 110, 114, 0.46);
    --text: #d7d7db;
    --text-2: #b3b4b9;
    --muted: #97989d;
    --hover: #2a2a2d;
    --selected: #2e2f33;
    --accent: #d0d0d6;
    --accent-text: #131416;
    --ring: #85868b;
    --success: #4ade80;
    --success-bg: rgba(74, 222, 128, 0.12);
    --warning: #fbbf24;
    --warning-bg: rgba(251, 191, 36, 0.12);
    --danger: #f3625f;
    --danger-bg: rgba(243, 98, 95, 0.12);
    --info: #60a5fa;
    --info-bg: rgba(96, 165, 250, 0.12);
    --shadow: 0 14px 36px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  ::selection { background: color-mix(in srgb, var(--info) 24%, transparent); }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }

  .icon { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .icon-sm { width: 14px; height: 14px; }
  .icon-lg { width: 20px; height: 20px; }

  .app { height: 100vh; display: flex; flex-direction: column; min-width: 720px; }

  /* toolbar */
  .toolbar {
    height: 48px; flex: none;
    display: flex; align-items: center; gap: 12px;
    padding: 0 10px 0 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: relative; z-index: 30;
  }
  .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .brand-mark {
    width: 28px; height: 28px; flex: none;
    display: grid; place-items: center;
    border-radius: 6px;
    color: #fff;
    background: linear-gradient(135deg, #2f7cf6 0%, #0f766e 100%);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16);
  }
  .brand-mark .icon { width: 15px; height: 15px; stroke-width: 2; }
  .brand-text { min-width: 0; }
  .brand-title { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.25; }
  .proto-badge {
    display: inline-flex; align-items: center; height: 15px; padding: 0 5px;
    border: 1px dashed var(--border-strong); border-radius: 3px;
    color: var(--muted); font-size: 9px; font-weight: 500; letter-spacing: 0.04em;
  }
  .brand-sub { margin-top: 1px; font-size: 10.5px; color: var(--muted); white-space: nowrap; }

  .toolbar-spacer { flex: 1; }
  .toolbar-actions { display: flex; align-items: center; gap: 5px; }
  .privacy-chip {
    display: inline-flex; align-items: center; gap: 5px;
    height: 24px; padding: 0 7px; margin-right: 3px;
    border-radius: 3px; color: var(--muted); font-size: 10.5px; white-space: nowrap;
  }
  .privacy-chip .icon { width: 12px; height: 12px; color: var(--success); }

  .output-pill {
    display: inline-flex; align-items: center; gap: 6px;
    height: 28px; padding: 0 9px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg); color: var(--text-2);
    font-size: 11.5px; white-space: nowrap;
    transition: background 120ms ease, border-color 120ms ease;
  }
  .output-pill:hover { background: var(--hover); border-color: var(--border-strong); color: var(--text); }
  .output-pill .icon { width: 13px; height: 13px; color: var(--muted); }
  .output-pill .chevron { width: 11px; height: 11px; }

  .icon-btn {
    width: 28px; height: 28px; flex: none;
    display: grid; place-items: center;
    border: 1px solid transparent; border-radius: var(--radius-sm);
    background: transparent; color: var(--muted);
    transition: background 120ms ease, color 120ms ease;
  }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .icon-btn:disabled { opacity: 0.38; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 28px; padding: 0 10px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg); color: var(--text-2);
    font-size: 11.5px; white-space: nowrap;
    transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
  }
  .btn:hover { background: var(--hover); color: var(--text); border-color: var(--border-strong); }
  .btn:disabled { opacity: 0.4; pointer-events: none; }
  .btn-primary {
    height: 30px; padding: 0 13px;
    border-color: var(--accent); background: var(--accent); color: var(--accent-text);
    font-weight: 600; font-size: 12px;
  }
  .btn-primary:hover { background: var(--accent); color: var(--accent-text); opacity: 0.9; border-color: var(--accent); }
  .btn-quiet { border-color: transparent; background: transparent; color: var(--muted); }
  .btn-quiet:hover { border-color: transparent; background: var(--hover); color: var(--text); }
  .btn-block { width: 100%; }
  .btn .icon { width: 13px; height: 13px; }

  /* conversion strip */
  .conversion-strip {
    display: none; flex: none;
    align-items: center; gap: 12px;
    height: 38px; padding: 0 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .conversion-strip.active { display: flex; }
  .strip-activity { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .strip-text { font-size: 11.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip-text b { color: var(--text); font-weight: 600; }
  .strip-progress { flex: 1; min-width: 80px; height: 3px; border-radius: 2px; background: var(--hover); overflow: hidden; }
  .strip-progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 120ms linear; }
  .strip-percent { width: 34px; text-align: right; font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); }
  .strip-cancel { height: 24px; padding: 0 8px; font-size: 11px; }

  /* workspace */
  .workspace { flex: 1; min-height: 0; display: grid; grid-template-columns: 306px minmax(0, 1fr); }

  /* queue */
  .queue { min-height: 0; display: flex; flex-direction: column; background: var(--sidebar); border-right: 1px solid var(--border); }
  .queue-head {
    height: 38px; flex: none;
    display: flex; align-items: center; gap: 7px;
    padding: 0 8px 0 13px;
    border-bottom: 1px solid var(--border-light);
  }
  .queue-title { font-size: 11.5px; font-weight: 650; letter-spacing: 0.01em; }
  .count-badge {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 17px; height: 17px; padding: 0 5px;
    border-radius: 9px; background: var(--hover); color: var(--muted);
    font-family: var(--font-mono); font-size: 9.5px; font-weight: 500;
  }
  .queue-tools { margin-left: auto; display: flex; gap: 1px; }

  .dropzone {
    flex: none;
    margin: 9px 9px 7px;
    padding: 9px 10px;
    display: flex; align-items: center; gap: 9px;
    border: 1px dashed var(--border-strong); border-radius: var(--radius-md);
    background: var(--bg); color: var(--muted); text-align: left;
    transition: border-color 120ms ease, background 120ms ease, color 120ms ease;
  }
  .dropzone:hover, .dropzone.dragover { border-color: var(--text-2); background: var(--hover); color: var(--text); }
  .dropzone.dragover { border-style: solid; box-shadow: inset 0 0 0 1px var(--border-strong); }
  .dropzone-mark {
    width: 26px; height: 26px; flex: none;
    display: grid; place-items: center;
    border-radius: var(--radius-sm); background: var(--hover); color: var(--muted);
  }
  .dropzone.dragover .dropzone-mark { background: var(--accent); color: var(--accent-text); }
  .dropzone-copy { min-width: 0; }
  .dropzone-copy b { display: block; color: var(--text); font-size: 11.5px; font-weight: 550; line-height: 1.35; }
  .dropzone-copy span { display: block; margin-top: 1px; font-size: 10px; color: var(--muted); }

  .file-list { flex: 1; min-height: 0; overflow: auto; padding: 0 6px 8px; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
  .file-list::-webkit-scrollbar { width: 6px; }
  .file-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
  .file-list::-webkit-scrollbar-track { background: transparent; }

  .file-item {
    position: relative;
    display: flex; align-items: flex-start; gap: 8px;
    padding: 7px 8px; margin-bottom: 1px;
    border-radius: var(--radius-sm);
    cursor: default;
    transition: background 100ms ease, box-shadow 100ms ease;
  }
  .file-item:hover { background: var(--hover); }
  .file-item.selected { background: var(--card); box-shadow: inset 2px 0 0 var(--accent), 0 0 0 1px var(--border); }
  .file-item.selected:hover { background: var(--card); }

  .ftype {
    width: 27px; height: 27px; flex: none;
    display: grid; place-items: center;
    border: 1px solid transparent; border-radius: var(--radius-sm);
    font-family: var(--font-mono); font-size: 8.5px; font-weight: 700; letter-spacing: 0.02em;
  }
  .ftype.pdf  { background: #fef2f2; color: #dc2626; border-color: #fee2e2; }
  .ftype.doc  { background: #eff6ff; color: #2563eb; border-color: #dbeafe; }
  .ftype.doc  { background: #eff6ff; color: #2563eb; border-color: #dbeafe; }
  .ftype.pptx { background: #fff7ed; color: #c2410c; border-color: #ffedd5; }
  .ftype.xlsx { background: #f0fdf4; color: #15803d; border-color: #dcfce7; }
  .ftype.md   { background: #f5f3ff; color: #7c3aed; border-color: #ede9fe; }
  .ftype.web  { background: #ecfeff; color: #0e7490; border-color: #cffafe; }
  .ftype.other { background: var(--hover); color: var(--muted); border-color: var(--border-light); }
  html[data-theme="dark"] .ftype.pdf  { background: rgba(248, 113, 113, 0.12); color: #f87171; border-color: rgba(248, 113, 113, 0.2); }
  html[data-theme="dark"] .ftype.doc  { background: rgba(96, 165, 250, 0.12); color: #93c5fd; border-color: rgba(96, 165, 250, 0.2); }
  html[data-theme="dark"] .ftype.pptx { background: rgba(251, 146, 60, 0.12); color: #fdba74; border-color: rgba(251, 146, 60, 0.2); }
  html[data-theme="dark"] .ftype.xlsx { background: rgba(74, 222, 128, 0.12); color: #86efac; border-color: rgba(74, 222, 128, 0.2); }
  html[data-theme="dark"] .ftype.md   { background: rgba(167, 139, 250, 0.12); color: #c4b5fd; border-color: rgba(167, 139, 250, 0.2); }
  html[data-theme="dark"] .ftype.web  { background: rgba(34, 211, 238, 0.12); color: #67e8f9; border-color: rgba(34, 211, 238, 0.2); }

  .file-main { flex: 1; min-width: 0; padding-top: 1px; }
  .file-name { display: block; font-size: 11.5px; font-weight: 500; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-meta { display: block; margin-top: 2px; font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-meta.warn { color: var(--warning); }
  .file-meta.danger { color: var(--danger); }
  .file-state { flex: none; padding-top: 5px; display: flex; align-items: center; gap: 4px; }
  .file-state .icon { width: 14px; height: 14px; }
  .state-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border-strong); display: block; margin: 3px; }
  .state-check { color: var(--success); }
  .state-warn { color: var(--warning); }
  .state-danger { color: var(--danger); }

  .file-remove {
    position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
    width: 20px; height: 20px; display: none; place-items: center;
    border: 0; border-radius: 3px; background: var(--card); color: var(--muted);
  }
  .file-remove:hover { background: var(--hover); color: var(--danger); }
  .file-item:hover .file-remove, .file-item:focus-within .file-remove { display: grid; }
  .file-item:hover .file-state, .file-item:focus-within .file-state { opacity: 0; }
  .file-progress { position: absolute; left: 8px; right: 8px; bottom: 1px; height: 2px; border-radius: 2px; background: var(--hover); overflow: hidden; }
  .file-progress i { display: block; height: 100%; width: 0; background: var(--info); transition: width 100ms linear; }

  .queue-foot {
    height: 33px; flex: none;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 0 8px 0 12px;
    border-top: 1px solid var(--border);
    font-size: 10px; color: var(--muted);
    white-space: nowrap;
  }
  .queue-foot .text-btn { font-size: 10px; }
  .text-btn { border: 0; background: transparent; color: var(--muted); padding: 3px 5px; border-radius: 3px; font-size: 11px; }
  .text-btn:hover { background: var(--hover); color: var(--text); }
  .text-btn:disabled { opacity: 0.4; pointer-events: none; }

  .queue-empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 16px; gap: 7px; color: var(--muted); text-align: center;
  }
  .queue-empty-icon { width: 34px; height: 34px; display: grid; place-items: center; border: 1px dashed var(--border-strong); border-radius: 50%; margin-bottom: 2px; }
  .queue-empty-title { font-size: 11.5px; color: var(--text-2); }

  /* preview */
  .preview { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }
  .preview-head {
    height: 54px; flex: none;
    display: flex; align-items: center; gap: 10px;
    padding: 0 12px 0 15px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .identity { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .identity .ftype { width: 30px; height: 30px; }
  .identity-text { min-width: 0; }
  .identity-name { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; line-height: 1.35; min-width: 0; }
  .identity-name > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .identity-meta { margin-top: 1px; font-size: 10.5px; color: var(--muted); white-space: nowrap; }
  .preview-actions { margin-left: auto; display: flex; align-items: center; gap: 2px; }

  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    height: 18px; padding: 0 6px;
    border-radius: 3px; font-size: 9.5px; font-weight: 600; white-space: nowrap;
  }
  .badge .icon { width: 10px; height: 10px; stroke-width: 2.2; }
  .badge.done { color: var(--success); background: var(--success-bg); }
  .badge.ready { color: var(--muted); background: var(--hover); }
  .badge.converting { color: var(--info); background: var(--info-bg); }
  .badge.warn { color: var(--warning); background: var(--warning-bg); }
  .badge.danger { color: var(--danger); background: var(--danger-bg); }
  .badge.muted { color: var(--muted); background: var(--hover); font-weight: 500; }

  .preview-tabs {
    height: 37px; flex: none;
    display: flex; align-items: center; gap: 1px;
    padding: 0 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .tab {
    position: relative; height: 100%;
    padding: 0 9px; border: 0; background: transparent;
    color: var(--muted); font-size: 11.5px;
    transition: color 100ms ease;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); font-weight: 600; }
  .tab.active::after {
    content: ""; position: absolute; left: 7px; right: 7px; bottom: -1px;
    height: 2px; border-radius: 2px 2px 0 0; background: var(--accent);
  }
  .tab:disabled { opacity: 0.38; pointer-events: none; }
  .tabs-meta { margin-left: auto; font-size: 10px; color: var(--muted); font-family: var(--font-mono); white-space: nowrap; }

  .preview-body { flex: 1; min-height: 0; overflow: auto; position: relative; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
  .preview-body::-webkit-scrollbar { width: 9px; }
  .preview-body::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 5px; border: 2px solid var(--bg); }
  .preview-body::-webkit-scrollbar-track { background: transparent; }

  /* document preview */
  .doc-sheet {
    width: min(860px, calc(100% - 44px));
    margin: 22px auto 40px;
    padding: 38px 50px 52px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.025);
  }
  html[data-theme="dark"] .doc-sheet { box-shadow: none; }
  .prose { font-size: 13.5px; line-height: 1.78; color: var(--text); }
  .prose > :first-child { margin-top: 0 !important; }
  .prose > :last-child { margin-bottom: 0 !important; }
  .prose h1 { font-size: 23px; line-height: 1.3; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 18px; }
  .prose h2 { font-size: 16.5px; line-height: 1.4; font-weight: 650; letter-spacing: -0.01em; margin: 30px 0 10px; padding-bottom: 5px; border-bottom: 1px solid var(--border-light); }
  .prose h3 { font-size: 14px; line-height: 1.45; font-weight: 650; margin: 22px 0 8px; }
  .prose p { margin: 0 0 13px; }
  .prose strong { font-weight: 650; }
  .prose code {
    padding: 1px 4px; border-radius: 3px;
    background: var(--hover); color: var(--text-2);
    font-family: var(--font-mono); font-size: 0.88em;
  }
  .prose a { color: var(--info); text-decoration: none; }
  .prose a:hover { text-decoration: underline; }
  .prose blockquote {
    margin: 16px 0;
    padding: 8px 14px;
    border-left: 3px solid var(--border-strong);
    background: var(--sidebar);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    color: var(--text-2);
  }
  .prose blockquote p:last-child { margin-bottom: 0; }
  .prose ul, .prose ol { margin: 0 0 14px; padding-left: 22px; }
  .prose li { margin: 4px 0; }
  .prose .md-table-wrap { margin: 16px 0; overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .prose .md-table { width: 100%; border-collapse: collapse; font-size: 12px; line-height: 1.55; }
  .prose .md-table th { text-align: left; font-weight: 600; background: var(--sidebar); padding: 7px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .prose .md-table td { padding: 7px 10px; border-bottom: 1px solid var(--border-light); vertical-align: top; }
  .prose .md-table tr:last-child td { border-bottom: 0; }
  .prose .md-code {
    position: relative;
    margin: 16px 0; padding: 15px 16px;
    background: var(--sidebar); border: 1px solid var(--border); border-radius: var(--radius-sm);
    overflow: auto;
  }
  .prose .md-code code { padding: 0; background: none; color: var(--text-2); font-size: 11.5px; line-height: 1.65; white-space: pre; }
  .prose .md-code::before {
    content: attr(data-lang);
    position: absolute; top: 5px; right: 8px;
    font-family: var(--font-mono); font-size: 8.5px; letter-spacing: 0.04em;
    color: var(--muted); text-transform: uppercase;
  }

  /* code / json views */
  .code-view { width: min(960px, calc(100% - 44px)); margin: 18px auto 36px; }
  .code-head {
    display: flex; align-items: center; gap: 8px;
    height: 30px; padding: 0 2px;
    font-size: 11px; color: var(--muted);
  }
  .code-head b { color: var(--text-2); font-weight: 600; }
  .code-head .spacer { flex: 1; }
  .code-block {
    margin: 0; padding: 16px 18px;
    background: var(--sidebar); border: 1px solid var(--border); border-radius: var(--radius-md);
    overflow: auto;
  }
  .code-block pre {
    margin: 0; color: var(--text-2);
    font-family: var(--font-mono); font-size: 11.5px; line-height: 1.7;
    white-space: pre-wrap; word-break: break-word; tab-size: 2;
  }
  .j-key { color: var(--info); }
  .j-str { color: var(--success); }
  .j-num { color: var(--warning); }
  .j-bool { color: #7c3aed; }
  .j-null { color: var(--muted); }
  html[data-theme="dark"] .j-bool { color: #c4b5fd; }

  /* structure */
  .structure { width: min(780px, calc(100% - 44px)); margin: 22px auto 40px; }
  .structure-head {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 10px; padding: 0 2px;
    font-size: 11px; color: var(--muted);
  }
  .structure-head b { color: var(--text-2); font-weight: 600; }
  .structure-head .spacer { flex: 1; }
  .tree {
    border: 1px solid var(--border); border-radius: var(--radius-md);
    background: var(--surface); overflow: hidden;
  }
  .tree-row {
    display: flex; align-items: flex-start; gap: 10px;
    min-height: 31px; padding: 6px 12px;
    border-bottom: 1px solid var(--border-light);
    font-size: 11.5px;
  }
  .tree-row:last-child { border-bottom: 0; }
  .tree-row:hover { background: var(--hover); }
  .tree-type {
    flex: none; width: 76px;
    font-family: var(--font-mono); font-size: 9.5px; color: var(--muted);
    padding-top: 1px; white-space: nowrap;
  }
  .tree-text { min-width: 0; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tree-row.root .tree-text { color: var(--text); font-weight: 600; }
  .tree-branch { flex: none; width: 10px; height: 10px; margin-top: 3px; border-left: 1px solid var(--border-strong); border-bottom: 1px solid var(--border-strong); border-radius: 0 0 0 2px; }

  /* state panels */
  .state-panel {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px; text-align: center;
  }
  .state-icon {
    width: 46px; height: 46px; display: grid; place-items: center;
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--surface); color: var(--muted); margin-bottom: 13px;
  }
  .state-icon.warn { color: var(--warning); background: var(--warning-bg); border-color: transparent; }
  .state-icon.danger { color: var(--danger); background: var(--danger-bg); border-color: transparent; }
  .state-icon.progress { color: var(--info); background: var(--info-bg); border-color: transparent; }
  .state-title { font-size: 14px; font-weight: 600; }
  .state-desc { max-width: 370px; margin-top: 6px; color: var(--muted); font-size: 11.5px; line-height: 1.65; }
  .state-actions { display: flex; align-items: center; gap: 7px; margin-top: 15px; }
  .state-progress { width: 240px; height: 3px; margin-top: 15px; border-radius: 2px; background: var(--hover); overflow: hidden; }
  .state-progress i { display: block; height: 100%; width: 0; background: var(--info); transition: width 100ms linear; }
  .state-progress-text { margin-top: 7px; font-family: var(--font-mono); font-size: 10px; color: var(--muted); }

  /* empty */
  .empty {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px; text-align: center;
  }
  .empty-icon {
    position: relative;
    width: 56px; height: 56px; display: grid; place-items: center;
    border: 1px solid var(--border); border-radius: 14px;
    background: var(--surface); color: var(--muted); margin-bottom: 15px;
  }
  .empty-icon::after {
    content: ""; position: absolute; inset: 7px; border: 1px dashed var(--border-light); border-radius: 8px;
  }
  .empty-title { font-size: 15px; font-weight: 600; }
  .empty-sub { max-width: 360px; margin-top: 6px; color: var(--muted); font-size: 11.5px; line-height: 1.65; }
  .format-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; max-width: 390px; margin-top: 15px; }
  .format-chip {
    padding: 2px 6px; border: 1px solid var(--border-light); border-radius: 3px;
    background: var(--surface); color: var(--muted);
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.02em;
  }
  .empty-actions { display: flex; gap: 7px; margin-top: 17px; }

  /* spinner */
  .spinner {
    width: 13px; height: 13px; flex: none; display: inline-block;
    border: 1.5px solid var(--border-strong); border-top-color: var(--text-2);
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  .spinner.light { border-color: rgba(255, 255, 255, 0.35); border-top-color: #fff; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* drawer */
  .scrim {
    position: fixed; inset: 48px 0 0 0; z-index: 40;
    background: rgba(15, 23, 42, 0.16);
    opacity: 0; pointer-events: none; transition: opacity 160ms ease;
  }
  .scrim.show { opacity: 1; pointer-events: auto; }
  html[data-theme="dark"] .scrim { background: rgba(0, 0, 0, 0.42); }

  .settings-drawer {
    position: fixed; top: 48px; right: 0; bottom: 0; z-index: 50;
    width: 342px; display: flex; flex-direction: column;
    background: var(--surface); border-left: 1px solid var(--border);
    box-shadow: var(--shadow);
    transform: translateX(102%);
    transition: transform 190ms cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .settings-drawer.open { transform: translateX(0); }
  .drawer-head {
    height: 50px; flex: none;
    display: flex; align-items: center; gap: 8px;
    padding: 0 10px 0 16px;
    border-bottom: 1px solid var(--border);
  }
  .drawer-title { font-size: 12.5px; font-weight: 650; }
  .drawer-sub { margin-top: 1px; font-size: 10px; color: var(--muted); }
  .drawer-body { flex: 1; min-height: 0; overflow: auto; padding: 0 16px 20px; }
  .setting-section { padding: 15px 0; border-bottom: 1px solid var(--border-light); }
  .setting-section:last-child { border-bottom: 0; }
  .setting-heading {
    margin-bottom: 9px;
    font-size: 9.5px; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted);
  }
  .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 11px; }
  .setting-row:last-child { margin-bottom: 0; }
  .setting-label { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text); }
  .setting-desc { margin-top: 2px; font-size: 10px; line-height: 1.55; color: var(--muted); }
  .setting-desc.compact { max-width: 230px; }
  .select {
    width: 100%; height: 29px; padding: 0 8px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg); color: var(--text); font-size: 11.5px;
  }
  .select:focus { outline: 2px solid var(--ring); outline-offset: 1px; }
  .path-hint {
    display: flex; align-items: center; gap: 5px;
    margin-top: 6px; font-family: var(--font-mono); font-size: 9.5px; color: var(--muted);
  }
  .path-hint .icon { width: 11px; height: 11px; }

  .switch {
    position: relative; flex: none;
    width: 30px; height: 18px; padding: 0;
    border: 1px solid var(--border-strong); border-radius: 9px;
    background: var(--hover);
    transition: background 140ms ease, border-color 140ms ease;
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--border-strong);
    transition: transform 140ms ease, background 140ms ease, border-color 140ms ease;
  }
  .switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
  .switch[aria-checked="true"]::after { transform: translateX(12px); background: var(--accent-text); border-color: var(--accent-text); }
  .switch:disabled { opacity: 0.42; }
  .switch:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

  .privacy-note {
    display: flex; gap: 8px; align-items: flex-start;
    margin-top: 16px; padding: 10px 11px;
    border: 1px solid var(--border-light); border-radius: var(--radius-sm);
    background: var(--sidebar); color: var(--muted);
    font-size: 10px; line-height: 1.6;
  }
  .privacy-note .icon { width: 13px; height: 13px; color: var(--success); margin-top: 1px; }
  .drawer-foot {
    flex: none; height: 42px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px 0 16px;
    border-top: 1px solid var(--border);
    font-size: 10px; color: var(--muted);
  }
  .drawer-foot .saved { display: inline-flex; align-items: center; gap: 5px; }
  .drawer-foot .icon { width: 12px; height: 12px; color: var(--success); }

  /* toast */
  .toast-wrap {
    position: fixed; left: 50%; bottom: 18px; z-index: 90;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    pointer-events: none;
  }
  .toast {
    display: flex; align-items: center; gap: 10px;
    max-width: min(480px, calc(100vw - 40px));
    padding: 7px 11px;
    border: 1px solid rgba(255, 255, 255, 0.1); border-radius: var(--radius-sm);
    background: var(--accent); color: var(--accent-text);
    box-shadow: var(--shadow); font-size: 11.5px;
    pointer-events: auto;
    animation: toast-in 160ms ease both;
  }
  .toast.out { animation: toast-out 160ms ease both; }
  .toast-action {
    border: 0; border-radius: 3px; padding: 2px 6px;
    background: rgba(255, 255, 255, 0.14); color: inherit; font-size: 10.5px;
  }
  html[data-theme="dark"] .toast-action { background: rgba(0, 0, 0, 0.14); }
  .toast-action:hover { background: rgba(255, 255, 255, 0.24); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  @keyframes toast-out { to { opacity: 0; transform: translateY(4px); } }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  @media (max-width: 980px) {
    .privacy-chip { display: none; }
    .workspace { grid-template-columns: 268px minmax(0, 1fr); }
    .doc-sheet { padding: 32px 34px 42px; }
  }
  @media (max-width: 820px) {
    .brand-sub { display: none; }
    .output-pill span { display: none; }
    .output-pill { width: 28px; justify-content: center; padding: 0; }
    .output-pill .chevron { display: none; }
    .workspace { grid-template-columns: 238px minmax(0, 1fr); }
    .tabs-meta { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>

<div class="app">
  <header class="toolbar">
    <div class="brand">
      <div class="brand-mark"><svg class="icon"><use href="#i-doc"/></svg></div>
      <div class="brand-text">
        <div class="brand-title">DocLite <span class="proto-badge">原型</span></div>
        <div class="brand-sub">文档转 Markdown · 本地优先</div>
      </div>
    </div>
    <div class="toolbar-spacer"></div>
    <div class="toolbar-actions">
      <span class="privacy-chip" title="除启用云 OCR 外，文件不会离开本机"><svg class="icon"><use href="#i-shield"/></svg>本地处理</span>
      <button class="output-pill" id="openSettings" type="button" title="打开导出设置">
        <svg class="icon"><use href="#i-sliders"/></svg>
        <span id="outputPillText">Markdown + JSON</span>
        <svg class="icon chevron"><use href="#i-chevron"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" type="button" title="切换亮 / 暗主题（原型）"></button>
      <button class="icon-btn" id="settingsBtn" type="button" title="导出设置"><svg class="icon"><use href="#i-sliders"/></svg></button>
      <button class="btn btn-primary" id="convertBtn" type="button">开始转换</button>
    </div>
  </header>

  <div class="conversion-strip" id="conversionStrip">
    <div class="strip-activity">
      <span class="spinner"></span>
      <span class="strip-text" id="stripText">正在转换</span>
    </div>
    <div class="strip-progress"><i id="stripProgress"></i></div>
    <span class="strip-percent" id="stripPercent">0%</span>
    <button class="btn strip-cancel" id="cancelBtn" type="button">取消</button>
  </div>

  <main class="workspace">
    <aside class="queue" aria-label="文件队列">
      <div class="queue-head">
        <span class="queue-title">队列</span>
        <span class="count-badge" id="queueCount">0</span>
        <div class="queue-tools">
          <button class="icon-btn" id="addBtn" type="button" title="添加文件"><svg class="icon"><use href="#i-plus"/></svg></button>
        </div>
      </div>
      <button class="dropzone" id="dropzone" type="button">
        <span class="dropzone-mark"><svg class="icon"><use href="#i-upload"/></svg></span>
        <span class="dropzone-copy">
          <b>拖入文档或点击添加</b>
          <span>支持 20+ 格式 · 不上传</span>
        </span>
      </button>
      <div class="file-list" id="fileList" role="listbox" aria-label="待转换文件"></div>
      <div class="queue-foot">
        <span id="queueFootText">0 个文件</span>
        <button class="text-btn" id="clearBtn" type="button">清空</button>
      </div>
    </aside>

    <section class="preview" aria-label="转换预览">
      <div class="preview-head">
        <div class="identity" id="previewIdentity"></div>
        <div class="preview-actions">
          <button class="btn btn-quiet" id="copyBtn" type="button" title="复制当前内容"><svg class="icon"><use href="#i-copy"/></svg><span>复制</span></button>
          <button class="btn btn-quiet" id="saveBtn" type="button" title="保存当前格式"><svg class="icon"><use href="#i-save"/></svg><span>保存</span></button>
          <button class="icon-btn" id="removeBtn" type="button" title="移出队列"><svg class="icon"><use href="#i-trash"/></svg></button>
        </div>
      </div>
      <div class="preview-tabs" role="tablist" aria-label="预览视图">
        <button class="tab active" data-tab="preview" role="tab" type="button">预览</button>
        <button class="tab" data-tab="markdown" role="tab" type="button">Markdown</button>
        <button class="tab" data-tab="json" role="tab" type="button">JSON</button>
        <button class="tab" data-tab="structure" role="tab" type="button">结构</button>
        <span class="tabs-meta" id="tabsMeta"></span>
      </div>
      <div class="preview-body" id="previewBody"></div>
    </section>
  </main>
</div>

<div class="scrim" id="scrim"></div>

<aside class="settings-drawer" id="settingsDrawer" aria-label="导出设置">
  <div class="drawer-head">
    <div style="flex:1;min-width:0">
      <div class="drawer-title">导出设置</div>
      <div class="drawer-sub">设置即时生效，无需保存</div>
    </div>
    <button class="icon-btn" id="closeSettings" type="button" title="关闭"><svg class="icon"><use href="#i-x"/></svg></button>
  </div>
  <div class="drawer-body">
    <section class="setting-section">
      <div class="setting-heading">输出格式</div>
      <div class="setting-row">
        <div>
          <div class="setting-label">Markdown</div>
          <div class="setting-desc">GFM，适合知识库与 LLM 上下文</div>
        </div>
        <button class="switch" id="swMarkdown" type="button" role="switch" aria-checked="true" aria-label="输出 Markdown"></button>
      </div>
      <div class="setting-row">
        <div>
          <div class="setting-label">Document Model</div>
          <div class="setting-desc">结构化 JSON，保留块级信息</div>
        </div>
        <button class="switch" id="swJson" type="button" role="switch" aria-checked="true" aria-label="输出 Document Model JSON"></button>
      </div>
    </section>

    <section class="setting-section">
      <div class="setting-heading">文件命名</div>
      <select class="select" id="namingSelect" aria-label="文件命名规则">
        <option value="original">原文件名</option>
        <option value="dated">原文件名 + 日期</option>
        <option value="indexed">统一前缀 + 序号</option>
      </select>
    </section>

    <section class="setting-section">
      <div class="setting-heading">输出位置</div>
      <select class="select" id="locationSelect" aria-label="输出位置">
        <option value="plugin">插件输出目录</option>
        <option value="ask">每次询问保存位置</option>
      </select>
      <div class="path-hint"><svg class="icon"><use href="#i-folder"/></svg><span id="outputPathHint">插件数据目录 / output</span></div>
      <div class="setting-row" style="margin-top:12px">
        <div class="setting-label">完成后打开输出目录</div>
        <button class="switch" id="swOpenAfter" type="button" role="switch" aria-checked="true" aria-label="完成后打开输出目录"></button>
      </div>
    </section>

    <section class="setting-section">
      <div class="setting-heading">OCR</div>
      <div class="setting-row">
        <div style="min-width:0">
          <div class="setting-label">扫描件识别 <span class="badge muted">未配置</span></div>
          <div class="setting-desc compact">v1 暂不内置离线模型。扫描件会标记为需要 OCR，不会被静默跳过。</div>
        </div>
        <button class="switch" type="button" role="switch" aria-checked="false" disabled aria-label="OCR 未启用"></button>
      </div>
      <button class="btn btn-block" id="configOcr" type="button" style="margin-top:10px">
        <svg class="icon"><use href="#i-sparkle"/></svg>配置云端 OCR
      </button>
    </section>

    <div class="privacy-note">
      <svg class="icon"><use href="#i-shield"/></svg>
      <span>除启用云 OCR 外，文档只在本机处理。OCR 凭据会单独保存在插件数据目录，不进入文档产物。</span>
    </div>
  </div>
  <div class="drawer-foot">
    <span class="saved"><svg class="icon"><use href="#i-check"/></svg>设置已生效</span>
    <button class="text-btn" id="resetSettings" type="button">恢复默认</button>
  </div>

## 1. 产品概述

DocLite 是一个**本地优先**的文档转换工具，把常见的办公文档转换为干净的 GFM Markdown，方便导入知识库、LLM 上下文和静态站点。

### 1.1 核心能力

| 能力 | 输入格式 | 输出 |
| --- | --- | --- |
| 文档转换 | DOCX / PDF / PPTX / XLSX | Markdown |
| 结构提取 | 所有支持格式 | Document Model JSON |
| 扫描件识别 | 图片型 PDF | Markdown（需 OCR） |

## 2. 转换流程

1. 导入文件并识别真实格式
2. 解析文档结构（标题、列表、表格）
3. 生成 GFM Markdown 与 Document Model
4. 按命名规则写入输出目录

## 3. 设计原则

- **本地优先**：除启用云 OCR 外，文件不会离开本机。
- **可见进度**：每个文件都有独立的阶段与页级进度。
- **失败可解释**：错误原因、警告与产物一起保留。`;

          actions: `

          desc: `正在解析 ${file.name}，完成后会立即更新预览。`,

  function renderSettings() {

    const strip = $("#conversionStrip");

    const current = state.files.find((file) => file.id === state.convertingFileId);
    const completed = Math.max(0, (state.convertingIndex || 1) - 1);
    const targetCount = state.conversionTotal || state.files.filter((f) => f.status === "ready" || f.status === "converting").length;
    const pct = Math.round(((completed + (current ? (current.progress || 0) / 100 : 0)) / Math.max(1, targetCount)) * 100);
    $("#stripText").innerHTML = `正在转换 <b>${escapeHtml(current ? current.name : "")}</b> · ${Math.min(completed + 1, targetCount)}/${targetCount}`;

  function updateProgressUI(file, targetCount) {
    const item = $(`.file-item[data-id="${cssEscape(file.id)}"]`);
    if (item) {
      const bar = item.querySelector(".file-progress i");
      if (bar) bar.style.width = `${file.progress || 0}%`;
      const meta = item.querySelector(".file-meta");
      if (meta) meta.textContent = fileMeta(file);

    if (state.selectedId === file.id) {
      const fill = $(".state-progress-fill");
      const text = $(".state-progress-text");
      if (fill) fill.style.width = `${file.progress || 0}%`;
      if (text) text.textContent = `${file.progress || 0}%`;
    }
    const completed = Math.max(0, (state.convertingIndex || 1) - 1);
    const pct = Math.round(((completed + (file.progress || 0) / 100) / Math.max(1, targetCount)) * 100);
    $("#stripProgress").style.width = `${Math.min(99, pct)}%`;
    $("#stripPercent").textContent = `${Math.min(99, pct)}%`;
    $("#stripText").innerHTML = `正在转换 <b>${escapeHtml(file.name)}</b> · ${state.convertingIndex || 1}/${targetCount}`;
  }

  function cssEscape(value) {
    if (window.CSS && typeof window.CSS.escape === "function") return window.CSS.escape(String(value));
    return String(value).replace(/["\\]/g, "\\$&");
  }

  function extractStructure(markdown = "") {
    const lines = String(markdown).replace(/\r\n?/g, "\n").split("\n");
    const blocks = [];
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (!line.trim()) { i += 1; continue; }

      if (/^```/.test(line.trim())) {
        const lang = line.trim().slice(3).trim() || "text";
        i += 1;
        const code = [];
        while (i < lines.length && !/^```/.test(lines[i].trim())) { code.push(lines[i]); i += 1; }
        i += 1;
        blocks.push({ type: "code", modelType: "CodeBlock", text: `${lang} · ${code.length} 行`, level: 0 });
        continue;
      }

      const heading = line.match(/^(#{1,6})\s+(.*)$/);
      if (heading) {
        blocks.push({ type: "heading", level: heading[1].length, modelType: `Heading ${heading[1].length}`, text: heading[2] });
        i += 1;
        continue;
      }

      if (/^\|/.test(line) && i + 1 < lines.length && lines[i + 1].includes("-") && /^\|?[\s:|-]+\|?$/.test(lines[i + 1])) {
        const cols = splitRow(line).length;
        i += 2;
        let rows = 0;
        while (i < lines.length && /^\|/.test(lines[i])) { rows += 1; i += 1; }
        blocks.push({ type: "table", level: 0, modelType: "Table", text: `${rows} 行 × ${cols} 列` });
        continue;
      }

      if (/^>\s?/.test(line)) {
        const quote = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) { quote.push(lines[i].replace(/^>\s?/, "")); i += 1; }
        blocks.push({ type: "quote", level: 0, modelType: "Blockquote", text: quote.join(" ").slice(0, 80) });
        continue;
      }

      if (/^[-*+]\s+/.test(line) || /^\d+\.\s+/.test(line)) {
        const ordered = /^\d+\.\s+/.test(line);
        let count = 0;
        while (i < lines.length && (/^[-*+]\s+/.test(lines[i]) || /^\d+\.\s+/.test(lines[i]))) { count += 1; i += 1; }
        blocks.push({ type: "list", level: 0, modelType: ordered ? "OrderedList" : "BulletList", text: `${count} 项` });
        continue;
      }

      const paragraph = [line];
      i += 1;
      while (i < lines.length && lines[i].trim() && !/^(#{1,6})\s|^```|^>\s?|^[-*+]\s|^\d+\.\s|^\|/.test(lines[i])) {
        paragraph.push(lines[i]); i += 1;
      }
      const text = paragraph.join(" ").replace(/\*\*|`/g, "").trim();
      blocks.push({ type: "paragraph", level: 0, modelType: "Paragraph", text: text.slice(0, 100) });
    }
    return blocks;
  }

  function buildDocumentModel(file) {
    const blocks = extractStructure(file.markdown || "").map((block, index) => ({
      index,
      type: block.type,
      level: block.level || 0,
      text: block.text || "",
      modelType: block.modelType
    }));
    return {
      version: 1,
      source: {
        name: file.name,
        format: String(file.ext || "").toUpperCase(),
        pages: file.pages || null,
        size: file.size || null
      },
      blocks
    };
  }

  function splitRow(line) {
    return line.replace(/^\|/, "").replace(/\|$/, "").split("|").map((cell) => cell.trim());
  }

  function inlineMarkdown(text) {
    let s = escapeHtml(text);
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, "<a>$1</a>");
    return s;
  }

  function renderMarkdown(markdown = "") {
    const lines = String(markdown).replace(/\r\n?/g, "\n").split("\n");
    const out = [];
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (!line.trim()) { i += 1; continue; }

      if (/^```/.test(line.trim())) {
        const lang = line.trim().slice(3).trim();
        const code = [];
        i += 1;
        while (i < lines.length && !/^```/.test(lines[i].trim())) { code.push(lines[i]); i += 1; }
        i += 1;
        out.push(`<pre class="md-code"${lang ? ` data-lang="${escapeHtml(lang)}"` : ""}><code>${escapeText(code.join("\n"))}</code></pre>`);
        continue;
      }

      const heading = line.match(/^(#{1,6})\s+(.*)$/);
      if (heading) {
        const level = heading[1].length;
        out.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
        i += 1;
        continue;
      }

      if (/^\|/.test(line) && i + 1 < lines.length && lines[i + 1].includes("-") && /^\|?[\s:|-]+\|?$/.test(lines[i + 1])) {
        const header = splitRow(line);
        i += 2;
        const rows = [];
        while (i < lines.length && /^\|/.test(lines[i])) { rows.push(splitRow(lines[i])); i += 1; }
        out.push(`<div class="md-table-wrap"><table class="md-table"><thead><tr>${header.map((cell) => `<th>${inlineMarkdown(cell)}</th>`).join("")}</tr></thead><tbody>${rows.map((row) => `<tr>${row.map((cell) => `<td>${inlineMarkdown(cell)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
        continue;
      }

      if (/^>\s?/.test(line)) {
        const quote = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) { quote.push(lines[i].replace(/^>\s?/, "")); i += 1; }
        out.push(`<blockquote>${quote.map((entry) => inlineMarkdown(entry)).join("<br>")}</blockquote>`);
        continue;
      }

      if (/^[-*+]\s+/.test(line) || /^\d+\.\s+/.test(line)) {
        const ordered = /^\d+\.\s+/.test(line);
        const items = [];
        while (i < lines.length && (/^[-*+]\s+/.test(lines[i]) || /^\d+\.\s+/.test(lines[i]))) {
          items.push(lines[i].replace(/^([-*+]|\d+\.)\s+/, ""));
          i += 1;
        }
        out.push(`<${ordered ? "ol" : "ul"}>${items.map((item) => `<li>${inlineMarkdown(item)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`);
        continue;
      }

      const paragraph = [line];
      i += 1;
      while (i < lines.length && lines[i].trim() && !/^(#{1,6})\s|^```|^>\s?|^[-*+]\s|^\d+\.\s|^\|/.test(lines[i])) {
        paragraph.push(lines[i]); i += 1;
      }
      out.push(`<p>${paragraph.map(inlineMarkdown).join("<br>")}</p>`);
    }
    return out.join("\n");
  }

  function highlightJson(value) {
    const text = escapeText(JSON.stringify(value, null, 2));
    return text.replace(/("(?:\\u[\da-fA-F]{4}|\\[^u]|[^\\"])*")(\s*:)?|\b(true|false)\b|\bnull\b|-?\d+(?:\.\d+)?(?:[eE][+\-]?\d+)?/g, (match, str, colon, bool) => {
      if (str) return `<span class="j-${colon ? "key" : "str"}">${str}</span>${colon || ""}`;
      if (bool) return `<span class="j-bool">${match}</span>`;
      if (match === "null") return `<span class="j-null">null</span>`;
      return `<span class="j-num">${match}</span>`;
    });
  }

  function generateMarkdown(file) {
    const name = baseName(file.name);
    return `# ${name}

> 由 DocLite 从 ${String(file.ext || "").toUpperCase()} 转换 · ${new Date().toLocaleString("zh-CN", { hour12: false })}

## 文档内容

当前原型仅演示转换流程与预览结构；真实转换由插件的 Rust sidecar 完成。

| 项目 | 值 |
| --- | --- |
| 源文件 | ${file.name} |
| 格式 | ${String(file.ext || "").toUpperCase()} |
| 大小 | ${formatBytes(file.size)} |

## 下一步

- 接入 anydoc，解析标题、段落、表格与列表
- 生成 Document Model，保留块级索引
- 按导出设置写入 Markdown 与 JSON
`;
  }

  function selectFile(id) {
    if (state.selectedId === id) return;
    state.selectedId = id;
    render();
  }

  function removeFile(id) {
    const target = state.files.find((file) => file.id === id);
    if (!target) return;
    if (state.converting && target.status === "converting") {
      showToast("转换中的文件不能移出队列");
      return;
    }
    const index = state.files.indexOf(target);
    state.files.splice(index, 1);
    if (state.selectedId === id) {
      state.selectedId = state.files[Math.min(index, state.files.length - 1)]?.id || null;
    }
    render();
    showToast(`已移出「${target.name}」`, {
      actionLabel: "撤销",
      duration: 5000,
      onAction: () => {
        state.files.splice(Math.min(index, state.files.length), 0, target);
        state.selectedId = target.id;
        render();
      }
    });
  }

  function clearAll() {
    if (state.converting) { showToast("转换进行中，暂时不能清空队列"); return; }
    if (!state.files.length) return;
    const snapshot = state.files.slice();
    const selected = state.selectedId;
    state.files = [];
    state.selectedId = null;
    render();
    showToast("已清空队列", {
      actionLabel: "撤销",
      duration: 5000,
      onAction: () => {
        state.files = snapshot;
        state.selectedId = selected;
        render();
      }
    });
  }

  function loadDemo() {
    state.files = demoFiles();
    state.selectedId = state.files[0].id;
    state.tab = "preview";
    for (const file of state.files) {
      if (file.status === "done") file.documentModel = buildDocumentModel(file);
    }
    render();
    showToast("已载入示例文件");
  }

  function addFiles(fileObjects) {
    const incoming = Array.from(fileObjects || []);
    if (!incoming.length) return;
    let firstAdded = null;
    incoming.forEach((entry, index) => {
      const ext = (entry.name.split(".").pop() || "").toLowerCase();
      const supported = SUPPORTED_EXTENSIONS.includes(ext);
      const isScan = ext === "pdf" && /scan|扫描/i.test(entry.name);
      const file = {
        id: `real-${Date.now()}-${index}`,
        name: entry.name,
        ext: ext || "?",
        size: entry.size || 0,
        status: !supported ? "failed" : isScan ? "needsOcr" : "ready",
        progress: 0,
        error: !supported ? `不支持的文件类型：.${ext || "未知"}` : null
      };
      state.files.push(file);
      if (!firstAdded) firstAdded = file;
    });
    if (firstAdded) state.selectedId = firstAdded.id;
    state.tab = "preview";
    render();
    showToast(`已加入 ${incoming.length} 个文件`);
  }

  function simulateFile(file, index, total) {
    return new Promise((resolve) => {
      let progress = 0;
      const step = () => {
        if (state.cancelRequested) { resolve("cancelled"); return; }
        progress += 4 + Math.random() * 8;
        if (progress >= 100) {
          file.progress = 100;
          updateProgressUI(file, total);
          setTimeout(() => resolve("done"), reduceMotion ? 0 : 160);
          return;
        }
        file.progress = Math.round(progress);
        updateProgressUI(file, total);
        setTimeout(step, reduceMotion ? 1 : 65);
      };
      setTimeout(step, reduceMotion ? 0 : 70);
    });
  }

  async function startConversion(ids = null) {
    if (state.converting) return;
    const targets = state.files.filter((file) => file.status === "ready" && (!ids || ids.includes(file.id)));
    if (!targets.length) { showToast("没有待转换文件"); return; }

    state.converting = true;
    state.cancelRequested = false;
    state.conversionTotal = targets.length;
    state.convertingIndex = 1;
    render();

    let success = 0;
    let failed = 0;
    let cancelled = false;

    for (let index = 0; index < targets.length; index += 1) {
      if (state.cancelRequested) { cancelled = true; break; }
      const file = targets[index];
      file.status = "converting";
      file.progress = 0;
      state.convertingFileId = file.id;
      state.convertingIndex = index + 1;
      if (!state.selectedId) state.selectedId = file.id;
      render();

      const result = await simulateFile(file, index, targets.length);
      if (result === "cancelled") {
        file.status = "ready";
        file.progress = 0;
        cancelled = true;
        break;
      }

      file.status = "done";
      file.progress = 100;
      file.markdown = file.markdown || generateMarkdown(file);
      file.documentModel = buildDocumentModel(file);
      success += 1;
      state.convertingFileId = null;
      render();
    }

    state.converting = false;
    state.convertingFileId = null;
    render();

    if (cancelled) {
      showToast("已取消转换");
      return;
    }
    const pendingOcr = state.files.filter((file) => file.status === "needsOcr").length;
    const suffix = pendingOcr ? ` · ${pendingOcr} 个需要 OCR` : "";
    showToast(`转换完成：${success} 个成功${failed ? ` · ${failed} 个失败` : ""}${suffix}`);
    if (state.settings.openAfter) {
      // Prototype: 真实插件会在这里调用 sidecar 打开输出目录。
    }
  }

  function openSettings() {
    $("#settingsDrawer").classList.add("open");
    $("#scrim").classList.add("show");
    $("#settingsDrawer").setAttribute("aria-hidden", "false");
  }

  function closeSettings() {
    $("#settingsDrawer").classList.remove("open");
    $("#scrim").classList.remove("show");
    $("#settingsDrawer").setAttribute("aria-hidden", "true");
  }

  function toggleFormat(key) {
    const next = { ...state.settings, [key]: !state.settings[key] };
    if (!next.markdown && !next.json) {
      showToast("至少保留一种输出格式");
      return;
    }
    state.settings = next;
    renderToolbar();
    renderSettings();
  }

  function resetSettings() {
    state.settings = { markdown: true, json: true, naming: "original", location: "plugin", openAfter: true };
    renderToolbar();
    renderSettings();
    showToast("已恢复默认设置");
  }

  function showToast(message, opts = {}) {
    const wrap = $("#toastWrap");
    const toast = document.createElement("div");
    toast.className = "toast";
    toast.innerHTML = `<span>${escapeHtml(message)}</span>`;
    if (opts.actionLabel) {
      const action = document.createElement("button");
      action.className = "toast-action";
      action.type = "button";
      action.textContent = opts.actionLabel;
      action.addEventListener("click", () => {
        opts.onAction?.();
        toast.remove();
      });
      toast.appendChild(action);
    }
    wrap.appendChild(toast);
    setTimeout(() => {
      toast.classList.add("out");
      setTimeout(() => toast.remove(), 180);
    }, opts.duration || 3200);
  }

  async function copyCurrent() {
    const file = getSelected();
    if (!file || file.status !== "done") return;
    const content = state.tab === "json"
      ? JSON.stringify(file.documentModel || buildDocumentModel(file), null, 2)
      : file.markdown || "";
    try {
      await navigator.clipboard.writeText(content);
    } catch {
      const area = document.createElement("textarea");
      area.value = content;
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.appendChild(area);
      area.select();
      document.execCommand("copy");
      area.remove();
    }
    showToast(state.tab === "json" ? "已复制 JSON" : "已复制 Markdown");
  }

  function saveCurrent() {
    const file = getSelected();
    if (!file || file.status !== "done") return;
    const isJson = state.tab === "json";
    const content = isJson
      ? JSON.stringify(file.documentModel || buildDocumentModel(file), null, 2)
      : file.markdown || "";
    const name = `${baseName(file.name)}${isJson ? ".json" : ".md"}`;
    const blob = new Blob([content], { type: isJson ? "application/json;charset=utf-8" : "text/markdown;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement("a");
    anchor.href = url;
    anchor.download = name;
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    setTimeout(() => URL.revokeObjectURL(url), 500);
    showToast(`已保存 ${name}`);
  }

  function toggleTheme() {
    state.theme = state.theme === "light" ? "dark" : "light";
    document.documentElement.dataset.theme = state.theme;
    renderTheme();
    try { localStorage.setItem("doclite-prototype-theme", state.theme); } catch { /* sandbox opaque origin */ }
  }

  function bindEvents() {
    $("#openSettings").addEventListener("click", openSettings);
    $("#settingsBtn").addEventListener("click", openSettings);
    $("#closeSettings").addEventListener("click", closeSettings);
    $("#scrim").addEventListener("click", closeSettings);
    $("#themeBtn").addEventListener("click", toggleTheme);
    $("#convertBtn").addEventListener("click", () => startConversion());
    $("#cancelBtn").addEventListener("click", () => { state.cancelRequested = true; });
    $("#addBtn").addEventListener("click", () => $("#fileInput").click());
    $("#dropzone").addEventListener("click", () => $("#fileInput").click());
    $("#clearBtn").addEventListener("click", clearAll);
    $("#copyBtn").addEventListener("click", copyCurrent);
    $("#saveBtn").addEventListener("click", saveCurrent);
    $("#removeBtn").addEventListener("click", () => {
      const file = getSelected();
      if (file) removeFile(file.id);
    });

    $("#swMarkdown").addEventListener("click", () => toggleFormat("markdown"));
    $("#swJson").addEventListener("click", () => toggleFormat("json"));
    $("#swOpenAfter").addEventListener("click", () => {
      state.settings.openAfter = !state.settings.openAfter;
      renderSettings();
    });
    $("#namingSelect").addEventListener("change", (event) => { state.settings.naming = event.target.value; });
    $("#locationSelect").addEventListener("change", (event) => {
      state.settings.location = event.target.value;
      renderSettings();
    });
    $("#resetSettings").addEventListener("click", resetSettings);
    $("#configOcr").addEventListener("click", () => showToast("OCR 配置会在接入云端引擎后提供；v1 先保留扫描件标记"));

    $$(".tab").forEach((tab) => tab.addEventListener("click", () => {
      if (tab.disabled) return;
      state.tab = tab.dataset.tab;
      $$(".tab").forEach((item) => {
        item.classList.toggle("active", item === tab);
        item.setAttribute("aria-selected", String(item === tab));
      });
      const file = getSelected();
      if (file) renderPreviewBody(file);
    }));

    $("#fileInput").addEventListener("change", (event) => {
      addFiles(event.target.files);
      event.target.value = "";
    });

    $("#fileList").addEventListener("click", (event) => {
      const remove = event.target.closest("[data-remove]");
      if (remove) { event.stopPropagation(); removeFile(remove.dataset.remove); return; }
      if (event.target.closest("[data-load-demo]")) { loadDemo(); return; }
      const item = event.target.closest(".file-item");
      if (item) selectFile(item.dataset.id);
    });

    $("#fileList").addEventListener("keydown", (event) => {
      const item = event.target.closest(".file-item");
      if (!item) return;
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        selectFile(item.dataset.id);
      }
      if (event.key === "Delete" || event.key === "Backspace") {
        event.preventDefault();
        removeFile(item.dataset.id);
      }
    });

    const queue = $(".queue");
    queue.addEventListener("dragover", (event) => {
      event.preventDefault();
      $("#dropzone").classList.add("dragover");
    });
    queue.addEventListener("dragleave", (event) => {
      if (!queue.contains(event.relatedTarget)) $("#dropzone").classList.remove("dragover");
    });
    queue.addEventListener("drop", (event) => {
      event.preventDefault();
      $("#dropzone").classList.remove("dragover");
      addFiles(event.dataTransfer.files);
    });
    document.addEventListener("dragover", (event) => event.preventDefault());
    document.addEventListener("drop", (event) => event.preventDefault());

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeSettings();
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        event.preventDefault();
        startConversion();
      }
    });
  }

  function init() {
    try {
      const stored = localStorage.getItem("doclite-prototype-theme");
      if (stored === "dark" || stored === "light") state.theme = stored;
    } catch { /* sandbox opaque origin */ }
    document.documentElement.dataset.theme = state.theme;
    state.files = demoFiles();
    state.selectedId = state.files[0].id;
    for (const file of state.files) {
      if (file.status === "done") file.documentModel = buildDocumentModel(file);
    }
    bindEvents();
    render();
    $("#settingsDrawer").setAttribute("aria-hidden", "true");
  }

  init();
})();
</script>
</body>
</html>
